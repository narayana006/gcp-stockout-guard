[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-stockout-guard"
version = "0.1.0"
description = "Spot Google Cloud capacity stockouts early from Compute Engine stockout error logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/narayana006/gcp-stockout-guard"

[project.scripts]
gcp-stockout-guard = "gcp_stockout_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
