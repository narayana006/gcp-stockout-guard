name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest
      - run: gcp-stockout-guard plan --logs examples/stockout_logs.json --advice examples/advice_capacity_us-central1.json --advice examples/advice_calendar_europe-west4.json --count 20
